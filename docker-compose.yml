services:
  nginx:
    image: nginx:alpine
    container_name: jev-bot-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jev-bot-for-vtop
    expose:
      - "8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - sessions_data:/app/.vtop_sessions
    restart: unless-stopped
    command: ["python", "main.py", "server", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  hf_cache:
  sessions_data:
